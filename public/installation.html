<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Réglage de l'application</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>main.wrap{max-width:560px;padding-block:28px 60px}h1{font-size:clamp(52px,14vw,88px)}input[type=password]{width:100%;background:var(--fond);border:1.5px solid var(--trait-2);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--blanc);text-transform:none;letter-spacing:0;font-weight:400}</style>
</head>
<body>
<main class="wrap">
  <span class="logo">AGENCE<br>GACOLET</span>
  <h1 style="margin-top:18px">Ré<span class="c">glage</span></h1>
  <p class="lead">À faire une seule fois. Les mots de passe restent sur le serveur, dans un fichier protégé.</p>
  <form class="form" id="f" novalidate>
    <h2 style="margin:0">Base de données</h2>
    <label>Serveur<input type="text" name="db_host" value="pj2n1b.myd.infomaniak.com"></label>
    <label>Utilisateur<input type="text" name="db_user" value="pj2n1b_appli"></label>
    <label>Nom de la base<input type="text" name="db_name" value="pj2n1b_gacolet_app"></label>
    <label>Mot de passe de la base<input type="password" name="db_password" autocomplete="off"></label>
    <h2 style="margin:8px 0 0">Espace agence</h2>
    <label>Mot de passe de l'espace agence<input type="password" name="admin_password" autocomplete="new-password"><span class="hint">10 caractères minimum</span></label>
    <label>Retapez-le<input type="password" name="admin_password2" autocomplete="new-password"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn go full" type="submit" id="go">Enregistrer</button>
  </form>
</main>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); const f = e.target, err = document.getElementById("err"), go = document.getElementById("go"); err.textContent = "";
  const d = Object.fromEntries(new FormData(f));
  if (d.admin_password !== d.admin_password2) { err.textContent = "Les deux mots de passe de l'espace agence sont différents."; return; }
  go.disabled = true; go.textContent = "Vérification…";
  try { const r = await fetch("/api/setup", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(d)}); const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Erreur.");
    f.innerHTML = '<h2 style="margin:0">C\'est réglé</h2><p class="lead" style="margin:0">La base est branchée et l\'espace agence est ouvert.</p><a class="btn go full" style="text-align:center;text-decoration:none;display:block" href="/agence">Ouvrir l\'espace agence</a>';
  } catch (x) { err.textContent = x.message; go.disabled = false; go.textContent = "Enregistrer"; }
};
</script>
</body>
</html>
