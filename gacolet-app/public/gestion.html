<body>
<style>
.splash{position:fixed;inset:0;z-index:200;background:#090908;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;animation:sp-out .6s cubic-bezier(.76,0,.24,1) 2.0s forwards}
.splash::before{content:"";position:absolute;left:50%;top:50%;width:140vmax;height:1px;background:#C6FF33;transform:translate(-50%,-50%) rotate(-36deg) scaleX(0);opacity:.9;animation:sp-beam .7s cubic-bezier(.6,0,.2,1) 0s forwards}
.splash svg{position:relative;width:min(260px,56vw);height:auto;overflow:visible;animation:sp-pop .55s cubic-bezier(.3,1.7,.5,1) 1.45s}
.splash path{fill:#C6FF33;fill-opacity:0;stroke:#C6FF33;stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.splash .sp-a{animation:sp-draw .6s cubic-bezier(.6,0,.2,1) .35s forwards,sp-fill .35s ease 1.0s forwards}
.splash .sp-b{animation:sp-draw .6s cubic-bezier(.6,0,.2,1) .55s forwards,sp-fill .35s ease 1.15s forwards}
.splash .sp-shine{transform:translateX(-120%);animation:sp-shine .7s cubic-bezier(.4,0,.2,1) 1.35s forwards}
@keyframes sp-beam{0%{transform:translate(-50%,-50%) rotate(-36deg) scaleX(0)}60%{transform:translate(-50%,-50%) rotate(-36deg) scaleX(1);opacity:.9}100%{transform:translate(-50%,-50%) rotate(-36deg) scaleX(1);opacity:0}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-fill{to{fill-opacity:1;stroke-opacity:0}}
@keyframes sp-shine{to{transform:translateX(120%)}}
@keyframes sp-pop{45%{transform:scale(1.07)}}
@keyframes sp-out{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 100% 0);visibility:hidden}}
@media (prefers-reduced-motion:reduce){.splash{animation:sp-out .3s ease .5s forwards}.splash *,.splash::before{animation:none!important}.splash path{fill-opacity:1;stroke-opacity:0}}
</style>
<div class="splash" id="splash" aria-hidden="true"><svg viewBox="140 158 561 281"><defs><linearGradient id="spg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="spc"><path transform="matrix(1,0,0,-1,232.1747,348.0155)" d="M0 0V0L-91.997-90.068 179.263 118.781 271.552 107.27 190.836 189.479 31.32 30.024"/><path transform="matrix(1,0,0,-1,700.5803,436.46803)" d="M0 0-147.532-1.615-193.477 45.57-273.888 22.275-261.335 93.466-366.182 35.258-183.556 179.076Z"/></clipPath></defs><path class="sp-a" pathLength="1" transform="matrix(1,0,0,-1,232.1747,348.0155)" d="M0 0V0L-91.997-90.068 179.263 118.781 271.552 107.27 190.836 189.479 31.32 30.024"/><path class="sp-b" pathLength="1" transform="matrix(1,0,0,-1,700.5803,436.46803)" d="M0 0-147.532-1.615-193.477 45.57-273.888 22.275-261.335 93.466-366.182 35.258-183.556 179.076Z"/><g clip-path="url(#spc)"><rect class="sp-shine" x="140" y="158" width="200" height="281" fill="url(#spg)" transform-origin="0 0" style="transform-box:view-box"/></g></svg></div>
<script>setTimeout(function(){var s=document.getElementById("splash");if(s)s.remove()},2700)</script>
<div class="shell" id="shell" hidden>
  <aside class="side">
    <a class="brand" href="#accueil" aria-label="Agence Gacolet, accueil"><svg viewBox="140 158 561 281" aria-hidden="true"><path transform="matrix(1,0,0,-1,700.5803,436.46803)" d="M0 0-147.532-1.615-193.477 45.57-273.888 22.275-261.335 93.466-366.182 35.258-183.556 179.076Z"/><path transform="matrix(1,0,0,-1,232.1747,348.0155)" d="M0 0V0L-91.997-90.068 179.263 118.781 271.552 107.27 190.836 189.479 31.32 30.024"/></svg></a>
    <nav class="nav" id="tabs" aria-label="Modules"></nav>
    <div class="side-foot">
      <div class="acct" id="acct" hidden><b id="acct-name"></b><span id="acct-role"></span></div>
      <label class="me" for="me" hidden><span>Je suis</span>
        <select id="me"><option value="Gabriel">Gabriel</option><option value="Matis">Matis</option><option value="Clara">Clara</option></select>
      </label>
      <button class="foot-link" type="button" id="logout">Se déconnecter</button>
    </div>
  </aside>
  <header class="mbar">
    <svg class="brand-sm" viewBox="140 158 561 281" aria-hidden="true"><path transform="matrix(1,0,0,-1,700.5803,436.46803)" d="M0 0-147.532-1.615-193.477 45.57-273.888 22.275-261.335 93.466-366.182 35.258-183.556 179.076Z"/><path transform="matrix(1,0,0,-1,232.1747,348.0155)" d="M0 0V0L-91.997-90.068 179.263 118.781 271.552 107.27 190.836 189.479 31.32 30.024"/></svg>
    <span class="mbar-title" id="mbar-title"></span>
    
    <button class="mbar-me" type="button" id="me-name" aria-label="Changer de personne"></button>
  </header>
  <main class="main"><div class="in" id="app"></div></main>
  <nav class="mtabs" id="mtabs" aria-label="Modules"></nav>
  <p class="offline" role="status">Hors connexion : les modifications reprendront au retour du réseau.</p>
</div>

<section class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <span class="logo lg"><span>AGENCE</span><span>GACOLET</span></span>
    <h1>Connexion</h1>
    <p>Espace interne de l’agence. Ton compte est créé par un propriétaire dans Paramètres.</p>
    <label for="user">Identifiant</label>
    <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn solid" type="submit">Entrer</button>
  </form>
</section>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="modal" id="modal"></div></div>

<script src="/gc-db.js"></script>
<script>
(function () {
  const shell = document.getElementById("shell"), login = document.getElementById("login");
  function boot() {
    login.hidden = true; shell.hidden = false;
    const s = document.createElement("script"); s.src = "/gestion.js?v=7"; document.body.appendChild(s);
  }
  window.addEventListener("gc-logout", () => location.reload());
  document.getElementById("logout").onclick = () => GC.logout();
  document.getElementById("me-name").onclick = () => { const m = document.querySelector(".morebtn"); if (m) m.click(); };
  if (GC.loggedIn()) return boot();
  login.hidden = false;
  const f = document.getElementById("login-form"), err = document.getElementById("login-err");
  document.getElementById("user").focus();
  f.onsubmit = async e => {
    e.preventDefault(); err.textContent = "";
    const b = f.querySelector("button"); b.disabled = true;
    try { await GC.login(document.getElementById("user").value, document.getElementById("pw").value); boot(); }
    catch (x) { err.textContent = x.message; b.disabled = false; }
  };
})();
</script>
<script>/* Pas de zoom au pincement ni au double appui : comportement d’une app */
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
/* Ordinateur : pas de zoom au clavier ni au pincement du pavé tactile */
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && ["+","-","=","_"].includes(e.key)) e.preventDefault(); }, { passive: false });
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });</script>
</body>
